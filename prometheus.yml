global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: service-a
    metrics_path: /metrics
    static_configs:
      - targets: ["service-a:3001"]
  - job_name: service-b
    metrics_path: /metrics
    static_configs:
      - targets: ["service-b:3002"]
  - job_name: service-c
    metrics_path: /metrics
    static_configs:
      - targets: ["service-c:3003"]
