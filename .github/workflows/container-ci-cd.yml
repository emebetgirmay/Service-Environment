name: Container CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify code, build, and containers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: service-a
            path: ./service-a
          - service: service-b
            path: ./service-b
          - service: service-c
            path: ./service-c

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          if [ -f "${{ matrix.path }}/test_*.py" ] || [ -f "${{ matrix.path }}/tests.py" ]; then
            pytest ${{ matrix.path }} -v --tb=short
          else
            echo "No tests found for ${{ matrix.service }}, skipping test step"
          fi

      - name: Lint with flake8 (optional)
        run: |
          pip install flake8
          flake8 ${{ matrix.path }} --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Build Docker image locally
        run: |
          docker build \
            -t ${{ matrix.service }}:${{ github.sha }} \
            -f ${{ matrix.path }}/Dockerfile \
            .

  verify-compose:
    name: Verify Docker Compose stack
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config

      - name: Build Compose stack
        run: docker compose build --pull

      - name: Start Compose stack
        run: docker compose up -d

      - name: Show running services
        run: docker compose ps

      - name: Check gateway health
        run: |
          sleep 15
          curl --fail http://localhost:8080/health || (docker compose logs && exit 1)

      - name: Check service logs
        if: failure()
        run: docker compose logs

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v

  publish:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs: verify-compose
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - service: service-a
            path: ./service-a
          - service: service-b
            path: ./service-b
          - service: service-c
            path: ./service-c

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set short commit hash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.path }}/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}-${{ matrix.service }}:sha-${{ env.SHORT_SHA }}
            ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}

      - name: Write deployment summary
        run: |
          echo "### Published Image" >> "$GITHUB_STEP_SUMMARY"
          echo "Service: ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}-${{ matrix.service }}:sha-${SHORT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Full commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
