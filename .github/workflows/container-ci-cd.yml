name: Container CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Group 9 is assigned eu-north-1 only — must match infra/ Region rule.
  AWS_REGION: eu-north-1

jobs:
  verify:
    name: Verify code, build, and containers
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: service-a
            path: ./service-a
          - service: service-b
            path: ./service-b
          - service: service-c
            path: ./service-c
          - service: nginx
            path: ./nginx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: |
          if [ "${{ matrix.service }}" != "nginx" ]; then
            pytest ${{ matrix.path }} -v --tb=short
          else
            echo "Nginx gateway has no python tests, skipping"
          fi

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 ${{ matrix.path }} \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics || true

      - name: Build Docker image locally
        run: |
          docker build \
            -t ${{ matrix.service }}:${{ github.sha }} \
            -f ${{ matrix.path }}/Dockerfile \
            .

  verify-compose:
    name: Verify Docker Compose stack
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build Compose stack
        run: docker compose build --pull

      - name: Start Compose stack
        run: |
          set -e

          if ! docker compose up -d --wait --wait-timeout 120; then
            echo "===== Docker Compose Status ====="
            docker compose ps -a

            echo "===== service-a logs ====="
            docker compose logs service-a || true

            echo "===== service-b logs ====="
            docker compose logs service-b || true

            echo "===== service-c logs ====="
            docker compose logs service-c || true

            echo "===== nginx logs ====="
            docker compose logs nginx || true

            echo "===== prometheus logs ====="
            docker compose logs prometheus || true

            echo "===== grafana logs ====="
            docker compose logs grafana || true

            echo "===== service-c health ====="
            docker inspect \
              --format='{{json .State.Health}}' \
              service-environment-service-c-1 || true

            exit 1
          fi

      - name: Show running services
        run: docker compose ps -a

      - name: Check gateway health
        run: |
          curl --fail http://localhost:8080/health

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------
  # Publish SHA-tagged images to the new account's ECR repos.
  #
  # CI has *build* authority only (Gate 1 design §8): this job pushes an
  # immutable <git-sha> image per service and stops. It never runs
  # Terraform and never deploys — the Release owner bumps the image tag in
  # infra/environments/lab/terraform.tfvars and applies to roll it out.
  #
  # Auth is GitHub OIDC into the role created by infra/bootstrap
  # (github-oidc.tf). Set the role ARN as repo variable AWS_DEPLOY_ROLE_ARN
  # (Settings → Secrets and variables → Actions → Variables). No long-lived
  # AWS keys are stored in GitHub.
  # ---------------------------------------------------------------------
  push-images:
    name: Push image to ECR (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [verify, verify-compose]
    # Publish only from main — on merge, or a manual run of the workflow on main.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: service-a
            ecr_repo: devops-g9-iac-service-a
          - service: service-b
            ecr_repo: devops-g9-iac-service-b
          - service: service-c
            ecr_repo: devops-g9-iac-service-c

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ matrix.ecr_repo }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$REPO:$TAG"

          # ECR repos are IMMUTABLE — a re-run for a SHA already pushed must
          # not try to push again (it would fail). Skip if the tag exists.
          if aws ecr describe-images \
                --repository-name "$REPO" \
                --image-ids imageTag="$TAG" \
                --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "$IMAGE already present — nothing to push."
            exit 0
          fi

          docker build -t "$IMAGE" -f "${{ matrix.service }}/Dockerfile" .
          docker push "$IMAGE"
          echo "Pushed $IMAGE"

      - name: Summary
        env:
          REPO: ${{ matrix.ecr_repo }}
          TAG: ${{ github.sha }}
        run: |
          {
            echo "### ${{ matrix.service }} image published"
            echo ""
            echo "- Repo: \`$REPO\`"
            echo "- Tag: \`$TAG\`"
            echo ""
            echo "To deploy: set \`${{ matrix.service }}_image_tag = \"$TAG\"\` in"
            echo "\`infra/environments/lab/terraform.tfvars\`, then \`terraform apply\`."
          } >> "$GITHUB_STEP_SUMMARY"
