groups:
  - name: service-observability
    rules:
      - alert: ServiceDown
        expr: up{job=~"service-a|service-b|service-c"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.job }} is unavailable"}
      - alert: HighErrorRate
        expr: sum by (service) (rate(http_errors_total[2m])) > 0.1
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.service }} has a high HTTP error rate"}
      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.service }} p95 HTTP latency exceeds 500ms"}
