map $http_x_request_id $log_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format json_access escape=json
    '{"timestamp":"$time_iso8601","request_id":"$log_request_id","method":"$request_method",'
    '"path":"$uri","status":$status,"upstream":"$upstream_addr","request_time":$request_time}';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/production-env.access.log json_access;
    error_log  /var/log/nginx/production-env.error.log warn;

    # Only Service A is exposed publicly. The /service-a/ prefix is stripped
    # before proxying since service-a's own routes have no prefix.
    location /service-a/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $log_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service B and Service C are internal-only and must never be reachable
    # through the public reverse proxy.
    location /service-b/ {
        return 403;
    }

    location /service-c/ {
        return 403;
    }

    location / {
        return 404;
    }
}
