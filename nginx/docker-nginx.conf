map $http_x_request_id $log_request_id {
    default $http_x_request_id;
    "" $request_id;
}

log_format json_access escape=json
    '{"timestamp":"$time_iso8601","request_id":"$log_request_id","method":"$request_method",'
    '"path":"$uri","status":$status,"upstream":"$upstream_addr","request_time":$request_time}';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log json_access;
    error_log /var/log/nginx/error.log warn;

    # Only Service A is exposed publicly
    location /service-a/ {
        proxy_pass http://service-a:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $log_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service B and C are internal-only
    location /service-b/ {
        return 403;
    }

    location /service-c/ {
        return 403;
    }

    location / {
        return 404;
    }
}
