services:
  nginx:
    image: nginx:1.27.0-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      service-a:
        condition: service_healthy
    networks:
      - frontend

  service-a:
    image: ${DOCKERHUB_USERNAME}/${APP_NAME}-service-a:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      service-b:
        condition: service_healthy
      service-c:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_B_URL=http://service-b:3002/process
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 2s
    networks:
      - frontend
      - backend

  service-b:
    image: ${DOCKERHUB_USERNAME}/${APP_NAME}-service-b:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      service-c:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_C_URL=http://service-c:3003/execute
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 2s
    networks:
      - backend

  service-c:
    image: ${DOCKERHUB_USERNAME}/${APP_NAME}-service-c:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_A_URL=http://service-a:3001/callback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 2s
    networks:
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
