services:
  nginx:
    # Same commit-pinned gateway image the CI builds and verifies — no stock
    # image + mounted config, so production runs exactly what CI tested.
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME}/${APP_NAME:?set APP_NAME}-nginx:${IMAGE_TAG:?set IMAGE_TAG}
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      service-a:
        condition: service_healthy
    networks:
      - frontend

  service-a:
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME}/${APP_NAME:?set APP_NAME}-service-a:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      service-b:
        condition: service_healthy
      service-c:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_B_URL=http://service-b:3002/process
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 2s
    networks:
      - frontend
      - backend

  service-b:
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME}/${APP_NAME:?set APP_NAME}-service-b:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      service-c:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_C_URL=http://service-c:3003/execute
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 2s
    networks:
      - backend

  service-c:
    image: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME}/${APP_NAME:?set APP_NAME}-service-c:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_A_URL=http://service-a:3001/callback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 2s
    networks:
      - backend

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"
    restart: unless-stopped
    networks:
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
